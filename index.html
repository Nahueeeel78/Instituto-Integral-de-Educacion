// ---- Guardado local en el celular (reemplaza window.storage de Claude.ai) ----
window.storage = {
  async get(key) {
    try {
      const v = localStorage.getItem("iide_" + key);
      return v !== null ? { key, value: v } : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      localStorage.setItem("iide_" + key, value);
      return { key, value };
    } catch (e) { return null; }
  }
};

const PALETTE = [
  { bg: "rgba(255,122,60,0.14)", bd: "rgba(255,150,90,0.4)", tx: "#ffb066" },
  { bg: "rgba(110,231,255,0.13)", bd: "rgba(110,231,255,0.4)", tx: "#6ee7ff" },

  { bg: "rgba(168,107,255,0.15)", bd: "rgba(168,107,255,0.45)", tx: "#c6a2ff" },
  { bg: "rgba(90,224,208,0.14)", bd: "rgba(90,224,208,0.42)", tx: "#7ce8d8" },
  { bg: "rgba(255,197,92,0.14)", bd: "rgba(255,197,92,0.4)", tx: "#ffd685" },
];
function colorFor(str) {
  if (!str) return PALETTE[0];
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

function materiaKey(careerKey, yearKey, materia) {
  return `${careerKey}::${yearKey}::${(materia || "").trim()}`;
}

function todayName() {
  const map = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  return map[new Date().getDay()];
}

function isNowInRange(range, now) {
  if (!range) return false;
  const parts = range.split(/[–-]/).map(s => s.trim());
  if (parts.length < 2) return false;
  const toMinutes = (t) => {
    const [h, m] = t.split(":").map(Number);
    if (Number.isNaN(h) || Number.isNaN(m)) return null;
    return h * 60 + m;
  };
  const start = toMinutes(parts[0]);
  const end = toMinutes(parts[1]);
  if (start === null || end === null) return false;
  const nowMin = now.getHours() * 60 + now.getMinutes();
  return nowMin >= start && nowMin < end;
}

function nowProgress(range, now) {
  if (!range) return null;
  const parts = range.split(/[–-]/).map(s => s.trim());
  if (parts.length < 2) return null;
  const toMinutes = (t) => {
    const [h, m] = t.split(":").map(Number);
    if (Number.isNaN(h) || Number.isNaN(m)) return null;
    return h * 60 + m;
  };
  const start = toMinutes(parts[0]);
  const end = toMinutes(parts[1]);
  if (start === null || end === null || end <= start) return null;
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const pct = ((nowMin - start) / (end - start)) * 100;
  return Math.max(0, Math.min(100, pct));
}

          50% { box-shadow: 0 0 18px rgba(196,113,237,0.65); }
        }
        .live-dot { position:absolute; top:6px; right:6px; width:9px; height:9px; z-index:2; }
        .live-dot::before {
          content:""; position:absolute; inset:0; border-radius:50%; background:#7ee8fa;
        }
        .live-dot-ring {
          position:absolute; inset:0; border-radius:50%; background:#7ee8fa;

        .live-badge-ring::before {
          content:""; position:absolute; inset:0; border-radius:50%; background:#7ee8fa;
          animation: ring-pulse 1.5s ease-out infinite;
        }
        .mini-progress-row { display:flex; align-items:center; gap:6px; margin-top:5px; }
        .mini-progress { flex:1; height:5px; border-radius:3px; background:rgba(255,255,255,0.2); overflow:hidden; }
        .mini-progress-fill {
          height:100%; border-radius:3px; background:linear-gradient(90deg,#7ee8fa,#c471ed);
          box-shadow: 0 0 8px rgba(196,113,237,0.7);
          transition: width 15s linear;
        }
        .mini-progress-pct {
          font-family:'Unbounded', sans-serif; font-size:9px; font-weight:700; color:#fff;
          flex-shrink:0; min-width:26px; text-align:right;
        }
        .th-row-now { color:#fff !important; }
        .th-row-now span { color:#fff !important; text-shadow: 0 0 8px rgba(255,255,255,0.6); }

        .signature {
          display:flex; align-items:center; justify-content:center; gap:8px;
          text-align:center; font-size:10px; color:rgba(255,255,255,0.65); padding: 14px 20px 18px;
        }
        .signature b { color:#fff; }

        .splash {
          position:fixed; inset:0; z-index:999;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
          background: linear-gradient(-45deg, #1b0e2e, #4a1a6b, #0e3b4a, #6b1a4a); background-size:400% 400%; animation: aurora-flow 12s ease infinite;
          transition: opacity .45s ease;
          opacity:1;
        }
        .splash.splash-out { opacity:0; pointer-events:none; }

        .splash-glow {
          position:absolute; width:220px; height:220px; border-radius:50%;
          background: radial-gradient(circle, rgba(255,255,255,0.5), rgba(255,255,255,0.15) 55%, transparent 75%);
          filter: blur(6px);
          animation: splash-glow-pulse 2s ease-in-out infinite;
        }
        @keyframes splash-glow-pulse {
          0%,100% { transform: scale(1); opacity:.8; }
          50% { transform: scale(1.15); opacity:1; }
        }

        .splash-tile {
          position:relative; width:130px; height:130px; border-radius:34px;
          background:#f5f2ee;
          display:flex; align-items:center; justify-content:center; overflow:hidden;
          box-shadow: 0 14px 34px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.5);
          transform: scale(0); opacity:0;
          animation: splash-tile-in .55s cubic-bezier(.34,1.56,.64,1) forwards;
          animation-delay: .1s;
        }
        @keyframes splash-tile-in {
          0% { transform: scale(0) translateY(-30px) rotate(-8deg); opacity:0; }
          65% { transform: scale(1.12) translateY(4px) rotate(2deg); opacity:1; }
          100% { transform: scale(1) translateY(0) rotate(0deg); opacity:1; }
        }
        .splash-tile-img { width:100%; height:100%; object-fit:cover; display:block; }

        .splash-text { text-align:center; opacity:0; transform: translateY(10px); animation: splash-text-in .5s ease forwards; animation-delay: .55s; }
        @keyframes splash-text-in { to { opacity:1; transform: translateY(0); } }
        .splash-name {
          font-family:'Unbounded', sans-serif; font-weight:700; font-size:18px; line-height:1.35;
          color:#fff; text-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .splash-sub { margin-top:8px; font-size:11px; color:rgba(255,255,255,0.85); letter-spacing:.04em; }

        .section-title {
          font-family:'Unbounded', sans-serif; font-weight:700; font-size:15px;
          padding: 2px 16px 2px; display:flex; align-items:center; gap:7px;
        }
        .section-sub { padding: 0 16px 12px; font-size:12.5px; color:rgba(255,255,255,0.8); }

        .year-pills { display:flex; gap:7px; padding: 14px 16px 12px; flex-wrap:wrap; }
        .year-pill {
          font-family:'Unbounded', sans-serif; font-size:11.5px; font-weight:700;
          padding:9px 13px; border-radius:11px; cursor:pointer;
          border:1px solid rgba(255,255,255,0.35); background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.85);
          backdrop-filter: blur(6px);
        }
        .year-pill.active {
          color:#2b1055; background: #fff;
          border-color:transparent; box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        .table-scroll {
          overflow: hidden;
          padding: 14px 16px 6px; margin-bottom: 6px;
        }
        .sched-table {
          display: grid; gap: 4px; align-items: stretch; width:100%;
        }
        .th, .th-row, .corner {
          font-family:'Unbounded', sans-serif; font-size: 9.5px; font-weight:700;
          color:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center;
          padding: 6px 2px; text-align:center; letter-spacing:.01em; min-width:0;
        }
        .th { position: sticky; top:0; }
        .th-today { color:#fff; text-shadow: 0 0 8px rgba(255,255,255,0.6); }
        .th-row {
          flex-direction:column; gap:1px; position: sticky; left:0; z-index:2;
          background: rgba(255,255,255,0.14); backdrop-filter: blur(8px); border-radius: 8px; color:rgba(255,255,255,0.7);
        }
        .th-row span { color:#fff; font-size:10.5px; }
        .th-row em { font-style:normal; font-size:7px; color:rgba(255,255,255,0.65); }
        .cell {
          position:relative;
          border: 1px solid rgba(255,255,255,0.3); border-radius: 10px;
          backdrop-filter: blur(8px);
          padding: 8px 6px 6px; display:flex; flex-direction:column; gap:4px;
          min-height: 68px; justify-content:center; min-width:0; overflow:hidden;
        }
        .cell-empty {
          align-items:center; justify-content:center; color:rgba(255,255,255,0.4); font-size:12px;
          border-style:dashed; background:rgba(255,255,255,0.06);
        }
        .cell-materia { font-weight:800; font-size:11px; line-height:1.22; word-break:break-word; color:#fff; text-shadow: 0 1px 4px rgba(0,0,0,0.2); }
        .cell-prof { display:flex; align-items:center; gap:3px; font-size:9px; color:rgba(255,255,255,0.9); font-weight:600; }
        .cell-prof-btn {
          display:flex; align-items:center; gap:3px; font-size:9.5px; font-weight:700;
          color:#fff; background:rgba(255,255,255,0.14); border:1px dashed rgba(255,255,255,0.5);
          border-radius:7px; padding:4px 6px; width:100%; max-width:100%; min-width:0;
          font-family:'Manrope',sans-serif; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .cell-prof-btn .pencil { opacity:.75; flex-shrink:0; }
        .cell-room {
          display:flex; align-items:center; gap:3px; font-size:9.5px; font-weight:700;
          color:#2b1055; background:rgba(255,255,255,0.9); border:1px dashed rgba(74,26,107,0.5);
          border-radius:7px; padding:4px 6px; margin-top:1px; width:100%; max-width:100%; min-width:0;
          font-family:'Manrope',sans-serif; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .cell-room .pencil { opacity:.75; flex-shrink:0; }

        .week-cards { display:flex; flex-direction:column; gap:12px; padding: 14px 16px 6px; }
        .day-card {
          border-radius: 18px; padding: 13px 14px 14px;
          background: rgba(255,255,255,0.14); backdrop-filter: blur(12px);
          border: 1px solid rgba(255,255,255,0.35);
        }
        .day-card-today {
          border-color: rgba(255,255,255,0.75);
          box-shadow: 0 8px 26px rgba(0,0,0,0.15);
        }
        .day-card-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
        .day-card-dot { width:8px; height:8px; border-radius:50%; background: #fff; flex-shrink:0; }
        .day-card-name { font-family:'Unbounded', sans-serif; font-weight:700; font-size:14.5px; color:#fff; }
        .day-card-badge {
          font-family:'Unbounded', sans-serif; font-size:8.5px; font-weight:700; letter-spacing:.05em;
          color:#2b1055; background:#fff; padding:3px 8px; border-radius:999px;
        }
        .day-card-empty { font-size:11px; color:rgba(255,255,255,0.6); font-style:italic; padding: 2px 0 2px; }
        .day-card-list { display:flex; flex-direction:column; gap:8px; }
        .day-row { display:flex; align-items:stretch; gap:9px; }
        .day-row-hour {
          flex-shrink:0; width:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
          font-family:'Unbounded', sans-serif; color:rgba(255,255,255,0.7);
        }
        .day-row-hour svg { color:rgba(255,255,255,0.65); margin-bottom:1px; }
        .day-row-hour span { font-size:11px; color:#fff; font-weight:700; }
        .day-row-hour em { font-style:normal; font-size:7px; color:rgba(255,255,255,0.6); text-align:center; }
        .day-row-body {
          position:relative;
          flex:1; min-width:0; border: 1px solid; border-radius: 12px; backdrop-filter: blur(8px);
          padding: 8px 10px; display:flex; flex-direction:column; gap:4px;
        }
        .day-row-materia { font-weight:800; font-size:13.5px; line-height:1.25; color:#fff; text-shadow: 0 1px 4px rgba(0,0,0,0.2); }

        .weekend-card {
          margin: 14px 16px 6px; padding: 26px 18px; text-align:center; border-radius:18px;
          background: rgba(255,255,255,0.14); backdrop-filter: blur(10px);
          border: 1px solid rgba(255,255,255,0.35);
        }
        .weekend-card .moon { color:#fff; margin-bottom:8px; }
        .weekend-card h3 { font-family:'Unbounded',sans-serif; font-size:14px; margin:0 0 5px; color:#fff; }
        .weekend-card p { font-size:11.5px; color:rgba(255,255,255,0.85); margin:0; }

        .legend { display:flex; gap:12px; flex-wrap:wrap; padding: 6px 16px 16px; font-size:10px; color:rgba(255,255,255,0.75); }
        .legend span { display:inline-flex; align-items:center; gap:4px; }


        .sheet-overlay {
          position: fixed; inset:0; z-index: 100;
          background: rgba(20,10,35,0.55); backdrop-filter: blur(4px);
          display:flex; align-items:flex-end; justify-content:center;
          touch-action: none;
        }
        .sheet {
          width:100%; max-width: 480px; background: rgba(74,26,107,0.5);
          backdrop-filter: blur(20px);
          border: 1px solid rgba(255,255,255,0.3); border-bottom:none;
          border-radius: 22px 22px 0 0; padding: 14px 16px calc(20px + env(safe-area-inset-bottom, 0px));
          box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
          max-height: 70vh; overflow-y:auto; touch-action: pan-y;
        }
        .sheet-handle { width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,0.35); margin: 0 auto 12px; }
        .sheet-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
        .sheet-title h3 { font-family:'Unbounded',sans-serif; font-size:13.5px; margin:0; display:flex; align-items:center; gap:7px; color:#fff; }
        .sheet-close { background:rgba(255,255,255,0.18); border:none; border-radius:8px; padding:6px; color:#fff; cursor:pointer; }
        .sheet-grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
        .sheet-opt {
          display:flex; align-items:center; gap:6px; font-family:'Manrope',sans-serif;
          font-weight:700; font-size:12.5px; padding: 12px 10px; border-radius:12px; cursor:pointer;
          border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.12); color:#fff;
        }
        .sheet-opt.active {
          color:#2b1055; background: #fff; border-color:transparent;
        }
        .sheet-input {
          width:100%; font-family:'Manrope',sans-serif; font-size:16px; font-weight:700;
          color:#fff; background:rgba(255,255,255,0.14); border:1.5px solid rgba(255,255,255,0.35);
          border-radius:12px; padding:13px 14px; margin-bottom:12px; outline:none;
        }
        .sheet-input::placeholder { color:rgba(255,255,255,0.55); }
        .sheet-input:focus { border-color: rgba(255,255,255,0.8); }
        .sheet-save {
          width:100%; display:flex; align-items:center; justify-content:center; gap:7px;
          font-family:'Unbounded',sans-serif; font-weight:700; font-size:12.5px; color:#2b1055;
          background: #fff; border:none; border-radius:12px;
          padding:13px; cursor:pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
      `}</style>

      {splashVisible && (
        <div className={"splash" + (splashFading ? " splash-out" : "")}>
          <div className="splash-glow" />
          <div className="splash-tile">
            <img src={SPLASH_LOGO_SRC} alt="Logo IIDE" className="splash-tile-img" />
          </div>
          <div className="splash-text">
            <div className="splash-name">Instituto Integral<br/>de Educación</div>
            <div className="splash-sub">Nivel Terciario · 2do. Cuatrimestre 2026</div>
          </div>
        </div>
      )}

      <div className="header">
        <div className="header-main">
          <div className="logo-ring"><div className="logo-box"><img src={LOGO_SRC} alt="Logo IIDE" /></div></div>
          <div>
            <h1>Instituto Integral de Educación</h1>
            <p>Nivel Terciario — 2do. Cuatrimestre 2026</p>
          </div>
        </div>
        <div className="menu-anchor">
          <button className="menu-btn" onClick={() => setMenuOpen(o => !o)}>
            <Menu size={16} strokeWidth={2.5} />
          </button>
        </div>
      </div>

      {view === "hoy" && (
        <>
          {!isWeekday && (
            <div className="weekend-card" style={{marginBottom:10}}>
              <div className="moon"><Moon size={26} strokeWidth={1.6} /></div>
              <p style={{margin:"0 0 10px"}}>Hoy es fin de semana, no hay clases.</p>
              <button className="weekend-btn" onClick={() => setView("semana")}>
                <Calendar size={13}/> Ver cuadro completo
              </button>
            </div>
          )}

          {isWeekday && (
            <ScheduleTable
              hours={careerHours}
              colLabels={yearNames}
              getCell={(ci, ri) => career.years[yearNames[ci]].days[today][ri]}
              careerKey={careerKey}
              colYear={(ci) => yearNames[ci]}
              getRoom={getRoom}
              getTeacher={getTeacher}
              onOpenRoom={openPicker}
              onOpenTeacher={openTeacherEditor}
              todayColIndex={-1}
              now={now}
            />
          )}

          <div className="legend">
            <span><Clock size={12}/> Horario</span>
            <span><User size={12}/> Profesor/a — tocá para editar</span>
            <span><MapPin size={12}/> Aula — tocá para editar</span>
          </div>
        </>
      )}

      {view === "semana" && (
        <>
          <div className="year-pills">
            {yearNames.map(y => (
              <button key={y} className={"year-pill" + (y === yearKey ? " active" : "")} onClick={() => setYearKey(y)}>
                {y} · {career.years[y].codigo}
              </button>
            ))}
          </div>

          <WeekCards
            hours={career.years[yearKey].hours}
            days={career.years[yearKey].days}
            careerKey={careerKey}
            yearKey={yearKey}
            getRoom={getRoom}
            getTeacher={getTeacher}
            onOpenRoom={openPicker}
            onOpenTeacher={openTeacherEditor}
            today={today}
            now={now}
          />

          <div className="legend">
            <span><Clock size={12}/> Horario</span>
            <span><User size={12}/> Profesor/a — tocá para editar</span>
            <span><MapPin size={12}/> Aula — tocá para editar</span>
          </div>
        </>
      )}

      <div className="signature">
        Desarrollado por <b>Nahuel Rodríguez</b> — Encargado de Computación
      </div>

      {picker && (
        <div className="sheet-overlay" onClick={() => setPicker(null)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-handle" />
            <div className="sheet-title">
              <h3><MapPin size={15}/> Elegí el aula</h3>
              <button className="sheet-close" onClick={() => setPicker(null)}><X size={16}/></button>
            </div>
            <div className="sheet-grid">
              {ROOM_OPTIONS.map(r => (
                <button
                  key={r}
                  className={"sheet-opt" + (r === picker.current ? " active" : "")}
                  onClick={() => applyRoom(r)}
                >
                  {r === picker.current && <Check size={13} strokeWidth={3}/>}
                  {r}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {teacherEditor && (
        <TeacherSheet editor={teacherEditor} onClose={() => setTeacherEditor(null)} onSave={applyTeacher} />
      )}

      {menuOpen && (
        <>
          <div className="menu-catcher" onClick={() => setMenuOpen(false)} />
          <div className="menu-pop">
            <div className="menu-pop-label">Carrera</div>
            <div className="menu-pop-item" onClick={() => { setCareerKey("sistemas"); setMenuOpen(false); }}>
              {careerKey === "sistemas" && <Check size={12} strokeWidth={3}/>}
              <span className={careerKey === "sistemas" ? "on" : ""}>Analista de Sistemas</span>
            </div>
            <div className="menu-pop-item" onClick={() => { setCareerKey("administracion"); setMenuOpen(false); }}>
              {careerKey === "administracion" && <Check size={12} strokeWidth={3}/>}
              <span className={careerKey === "administracion" ? "on" : ""}>Administración de Empresas</span>
            </div>
            <div className="menu-pop-sep" />
            <div className="menu-pop-label">Vista</div>
            <div className="menu-pop-item" onClick={() => { setView("hoy"); setMenuOpen(false); }}>
              {view === "hoy" && <Check size={12} strokeWidth={3}/>}
              <span className={view === "hoy" ? "on" : ""}>HOY</span>
            </div>
            <div className="menu-pop-item" onClick={() => { setView("semana"); setMenuOpen(false); }}>
              {view === "semana" && <Check size={12} strokeWidth={3}/>}
              <span className={view === "semana" ? "on" : ""}>Cuadro completo</span>
            </div>
            <div className="menu-pop-sep" />
            <div className="menu-pop-label"><SlidersHorizontal size={10} strokeWidth={2.5}/> Ajustes</div>
            <div className={"menu-pop-item menu-pop-danger" + (resetConfirm ? " on" : "")} onClick={resetOverrides}>
              <RotateCcw size={12} strokeWidth={2.5}/>
              <span>{resetConfirm ? "¿Seguro? Tocá de nuevo" : "Restablecer aulas y profesores"}</span>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function TeacherSheet({ editor, onClose, onSave }) {
  const initial = editor.current === "Sin profesor asignado" ? "" : editor.current;
  const [val, setVal] = useState(initial);
  return (
    <div className="sheet-overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-handle" />
        <div className="sheet-title">
          <h3><User size={15}/> Editar profesor/a</h3>
          <button className="sheet-close" onClick={onClose}><X size={16}/></button>
        </div>
        <input
          className="sheet-input"
          type="text"
          placeholder="Nombre del profesor/a"
          value={val}
          onChange={e => setVal(e.target.value)}
          autoFocus
        />
        <button className="sheet-save" onClick={() => onSave(val)}>
          <Check size={15} strokeWidth={3}/> Guardar
        </button>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
